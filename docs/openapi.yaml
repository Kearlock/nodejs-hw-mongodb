openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Contacts Application backend

tags: # теги, що ви будете використовувати
  - name: Contacts
    description: Dealing with the contacts
  - name: ContactId
    description: Dealing with the single contact though its ID

servers:
  # - url: http://localhost:1976
  - url: https://nodejs-hw-mongodb-ipwg.onrender.com

paths: # тут будуть посилання на ендпоінти
  /contacts:
    get:
      $ref: ./swagger/paths/contacts/get.yaml
    post:
      $ref: ./swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
    get:
      $ref: ./swagger/paths/contacts/{contactId}/get.yaml
    patch:
      $ref: ./swagger/paths/contacts/{contactId}/patch.yaml
    delete:
      $ref: ./swagger/paths/contacts/{contactId}/delete.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
