type: object
properties:
  name:
    type: string
    description: Contact's name
    example: John Dow
  phoneNumber:
    type: string
    description: Contact's phone number
    example: +380679657313
  email:
    type: string
    description: Contact's email
    example: johnd@mail.com
  photo:
    type: string
    description: Contact photo
    format: binary
  isFavourite:
    type: boolean
    description: Is contact favourite
    default: false
    example: true
  contactType:
    type: string
    description: Type of the contact
    enum: ['work', 'home', 'personal']
    example: personal
