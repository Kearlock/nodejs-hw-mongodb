type: object
properties:
  _id:
    type: string
    description: Contact's ID
    example: 68efd41636a23320bb4ef586
  name:
    type: string
    description: Contact's name
    example: John Dow
  phoneNumber:
    type: string
    description: Contact's phone number
    example: +380679657313
  email:
    type: string
    description: Contact's email
    example: johnd@mail.com
  photo:
    type: string
    description: Contact photo link
    example: https://res.cloudinary.com/dn0bwknxc/image/upload/v1760706215/wcjqh1ihysf05swm7csi.png
  isFavourite:
    type: boolean
    description: Is contact favourite
    default: false
    example: true
  contactType:
    type: string
    description: Type of the contact
    enum: ['work', 'home', 'personal']
    example: personal
  userId:
    type: string
    description: Contact's owner ID
    example: 68efd834f1781f960b1e7a6c
  createdAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
