tags:
  - ContactId
summary: Edit contact's data
operationId: patchContact
description: Find the contact by its ID and edit its data
security:
  - bearerAuth: []

parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 68efd41636a23320bb4ef586

requestBody:
  content:
    multipart/form-data:
      schema:
        $ref: ../../../components/schemes/patchContact.yaml

responses:
  '200':
    description: Contact found by its ID
    content:
      application/json:
        schema:
          type: object
          # required:
          #   - status
          #   - message
          #   - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemes/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref:
      ../../../components/responses/500.yaml
      # '403':
      #   description: Requested contact not avaliable
      #   content:
      #     application/json:
      #       schema:
      #         type: object
      #         required:
      #           - status
      #           - message
      #         properties:
      #           status:
      #             type: integer
      #             example: 403
      #           message:
      #             type: string
      #             example: Contact unavailable
